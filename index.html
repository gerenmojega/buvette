<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buvette Fix</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 10px; margin: 0; padding-bottom: 100px; }
        h2 { text-align: center; color: #f39c12; }
        
        .boisson-wrapper { position: relative; margin-bottom: 10px; background: #c0392b; border-radius: 12px; overflow: hidden; min-height: 70px; }
        .favori-bg { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #f1c40f; display: flex; align-items: center; padding-left: 20px; color: black; font-weight: bold; z-index: 1; }
        
        .boisson-row { 
            position: relative; display: flex; align-items: center; background: #2a2a2a; padding: 10px; 
            transition: transform 0.2s; z-index: 2; touch-action: pan-y;
        }

        .reorder-btns { display: flex; flex-direction: column; gap: 4px; margin-right: 10px; }
        .btn-move { background: #444; color: white; border: none; border-radius: 4px; height: 25px; width: 35px; font-weight: bold; }

        .info { flex-grow: 1; min-width: 0; }
        .nom { font-size: 1.1rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .controls { display: flex; align-items: center; gap: 10px; }
        .btn-calc { border: none; border-radius: 50%; color: white; font-weight: bold; width: 45px; height: 45px; font-size: 1.5rem; }
        .btn-plus { background: #2ecc71; }
        .btn-moins { background: #e74c3c; }
        .compteur { font-size: 1.4rem; min-width: 30px; text-align: center; }

        .fab {
            position: fixed; bottom: 20px; right: 20px;
            width: 60px; height: 60px; background: #3498db;
            border-radius: 50%; border: none; color: white;
            font-size: 2rem; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .reset-link { display: block; width: 100%; margin-top: 40px; background: none; border: none; color: #555; text-decoration: underline; }
    </style>
</head>
<body>

    <h2>📊 Ma Buvette</h2>
    <div id="menu"></div>
    <button class="fab" onclick="ajouterBoisson()">+</button>
    <button class="reset-link" onclick="resetCounts()">Réinitialiser les compteurs</button>

    <script>
        // Initialisation sécurisée
        let rawData = localStorage.getItem('buvetteV4');
        let data = { boissons: [] };

        try {
            if (rawData) {
                data = JSON.parse(rawData);
            } else {
                data.boissons = [
                    { id: 1, nom: "🍺 Bière", count: 0, fav: false },
                    { id: 2, nom: "🥤 Soda", count: 0, fav: false }
                ];
            }
        } catch (e) {
            console.error("Erreur de lecture :", e);
            data.boissons = [{ id: 1, nom: "Erreur - Reset requis", count: 0, fav: false }];
        }

        const menuEl = document.getElementById('menu');

        function render() {
            menuEl.innerHTML = '';
            data.boissons.forEach((b, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'boisson-wrapper';
                wrapper.innerHTML = `
                    <div class="favori-bg">★ Favori</div>
                    <div class="boisson-row">
                        <div class="reorder-btns">
                            <button class="btn-move" onclick="deplacer(${index}, -1)">↑</button>
                            <button class="btn-move" onclick="deplacer(${index}, 1)">↓</button>
                        </div>
                        <div class="info">
                            <div class="nom">${b.nom}${b.fav ? ' ⭐' : ''}</div>
                        </div>
                        <div class="controls">
                            <button class="btn-calc btn-moins" onclick="mod(${b.id}, -1)">-</button>
                            <span class="compteur" id="cnt-${b.id}">${b.count}</span>
                            <button class="btn-calc btn-plus" onclick="mod(${b.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                setupSwipe(wrapper.querySelector('.boisson-row'), b.id);
                menuEl.appendChild(wrapper);
            });
        }

        function setupSwipe(el, id) {
            let startX = 0, currentX = 0;
            el.addEventListener('touchstart', e => { 
                startX = e.touches[0].clientX; 
                el.style.transition = 'none'; 
            }, {passive: true});

            el.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX - startX;
                if (Math.abs(currentX) > 5) {
                    el.style.transform = `translateX(${currentX}px)`;
                }
            }, {passive: true});

            el.addEventListener('touchend', () => {
                el.style.transition = 'transform 0.3s ease';
                if (currentX > 130) toggleFav(id);
                else if (currentX < -130) suppr(id);
                el.style.transform = '';
                currentX = 0;
            });
        }

        function mod(id, val) {
            const b = data.boissons.find(x => x.id === id);
            if(b) {
                b.count = Math.max(0, b.count + val);
                save();
                document.getElementById('cnt-' + id).innerText = b.count;
            }
        }

        function deplacer(index, dir) {
            let n = index + dir;
            if (n >= 0 && n < data.boissons.length) {
                [data.boissons[index], data.boissons[n]] = [data.boissons[n], data.boissons[index]];
                save(); render();
            }
        }

        function toggleFav(id) {
            const b = data.boissons.find(x => x.id === id);
            if(b) { b.fav = !b.fav; save(); render(); }
        }

        function suppr(id) {
            if(confirm("Supprimer cette boisson ?")) {
                data.boissons = data.boissons.filter(x => x.id !== id);
                save(); render();
            }
        }

        function ajouterBoisson() {
            const n = prompt("Nom de la boisson :");
            if(n && n.trim() !== "") {
                data.boissons.push({ id: Date.now(), nom: n, count: 0, fav: false });
                save(); render();
            }
        }

        function save() { localStorage.setItem('buvetteV4', JSON.stringify(data)); }
        
        function resetCounts() {
            if(confirm("Remettre à zéro ?")) {
                data.boissons.forEach(b => b.count = 0);
                save(); render();
            }
        }

        render();
    </script>
</body>
</html>
