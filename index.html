<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buvette Swipe Master</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 10px; margin: 0; touch-action: pan-y; }
        h2 { text-align: center; color: #f39c12; }
        
        .container { position: relative; overflow: hidden; }
        
        /* Style de la ligne de boisson */
        .boisson-wrapper { position: relative; margin-bottom: 10px; background: #c0392b; border-radius: 12px; overflow: hidden; }
        
        .favori-bg { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #f1c40f; display: flex; align-items: center; padding-left: 20px; color: black; font-weight: bold; z-index: 1; }
        
        .boisson-row { 
            position: relative;
            display: flex; 
            align-items: center; 
            background: #2a2a2a; 
            padding: 15px 10px; 
            transition: transform 0.2s ease-out;
            z-index: 2;
            touch-action: none; /* Nécessaire pour le drag manuel */
        }

        .handle { cursor: grab; padding: 10px; color: #555; font-size: 1.5rem; }
        
        .info { flex-grow: 1; margin-left: 5px; }
        .nom { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; }
        .fav-star { color: #f1c40f; margin-left: 5px; }

        .controls { display: flex; align-items: center; gap: 15px; }
        button { border: none; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .btn-plus { width: 45px; height: 45px; font-size: 1.5rem; background: #2ecc71; }
        .btn-moins { width: 40px; height: 40px; font-size: 1.2rem; background: #e74c3c; }
        .compteur { font-size: 1.5rem; min-width: 30px; text-align: center; }

        .btn-ajouter { background: #3498db; border: none; border-radius: 10px; width: 100%; height: 50px; color: white; font-size: 1rem; margin-bottom: 15px; }
        .reset-btn { background: none; color: #555; border: none; text-decoration: underline; width: 100%; margin-top: 20px; }

        /* Style quand on déplace (Y) */
        .dragging { opacity: 0.5; background: #3498db !important; }
    </style>
</head>
<body>

    <h2>📊 Buvette Tactile</h2>
    
    <button class="btn-ajouter" onclick="ajouterBoisson()">➕ Ajouter une boisson</button>

    <div id="menu" class="container"></div>

    <button class="reset-btn" onclick="resetCounts()">Réinitialiser les compteurs</button>

    <script>
        let data = JSON.parse(localStorage.getItem('buvetteSwipe')) || {
            boissons: [
                { id: 1, nom: "🍺 Bière", count: 0, fav: false },
                { id: 2, nom: "🥤 Soda", count: 0, fav: false },
                { id: 3, nom: "🍷 Vin", count: 0, fav: false }
            ]
        };

        const menuEl = document.getElementById('menu');

        function render() {
            menuEl.innerHTML = '';
            // On trie : les favoris en haut
            const sorted = [...data.boissons].sort((a, b) => b.fav - a.fav);

            sorted.forEach((b, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'boisson-wrapper';
                
                wrapper.innerHTML = `
                    <div class="favori-bg">★ Favori</div>
                    <div class="boisson-row" data-id="${b.id}" draggable="true">
                        <div class="handle">⠿</div>
                        <div class="info">
                            <div class="nom">${b.nom} ${b.fav ? '<span class="fav-star">★</span>' : ''}</div>
                        </div>
                        <div class="controls">
                            <button class="btn-moins" onclick="event.stopPropagation(); mod(${b.id}, -1)">-</button>
                            <span class="compteur">${b.count}</span>
                            <button class="btn-plus" onclick="event.stopPropagation(); mod(${b.id}, 1)">+</button>
                        </div>
                    </div>
                `;

                const row = wrapper.querySelector('.boisson-row');
                setupSwipe(row, b.id);
                setupDragY(row, b.id);
                
                menuEl.appendChild(wrapper);
            });
        }

        // --- GESTION DU SWIPE (AXE X) ---
        function setupSwipe(el, id) {
            let startX = 0;
            let currentX = 0;

            el.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
            }, {passive: true});

            el.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX - startX;
                if (currentX > 0) { // Vers la droite (Favori)
                    el.style.transform = `translateX(${currentX}px)`;
                } else { // Vers la gauche (Supprimer)
                    el.style.transform = `translateX(${currentX}px)`;
                }
            }, {passive: true});

            el.addEventListener('touchend', e => {
                el.style.transition = 'transform 0.3s ease';
                if (currentX > 150) { // Seuil Favori
                    toggleFav(id);
                } else if (currentX < -150) { // Seuil Supprimer
                    suppr(id);
                }
                el.style.transform = '';
                setTimeout(() => el.style.transition = '', 300);
                currentX = 0;
            });
        }

        // --- GESTION DU DÉPLACEMENT (AXE Y) ---
        function setupDragY(el, id) {
            el.addEventListener('dragstart', () => el.classList.add('dragging'));
            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                saveOrder();
            });
        }

        menuEl.addEventListener('dragover', e => {
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            const afterElement = getDragAfterElement(menuEl, e.clientY);
            if (afterElement == null) {
                menuEl.appendChild(draggingItem.parentElement);
            } else {
                menuEl.insertBefore(draggingItem.parentElement, afterElement.parentElement);
            }
        });

        function getDragAfterElement(container, y) {
            const elements = [...container.querySelectorAll('.boisson-row:not(.dragging)')];
            return elements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // --- ACTIONS ---
        function mod(id, val) {
            const b = data.boissons.find(x => x.id === id);
            b.count = Math.max(0, b.count + val);
            save(); render();
        }

        function toggleFav(id) {
            const b = data.boissons.find(x => x.id === id);
            b.fav = !b.fav;
            save(); render();
        }

        function suppr(id) {
            if(confirm("Supprimer cette boisson ?")) {
                data.boissons = data.boissons.filter(x => x.id !== id);
                save(); render();
            }
        }

        function ajouterBoisson() {
            const n = prompt("Nom de la boisson :");
            if(n) {
                data.boissons.push({ id: Date.now(), nom: n, count: 0, fav: false });
                save(); render();
            }
        }

        function saveOrder() {
            const rows = [...document.querySelectorAll('.boisson-row')];
            const newOrder = rows.map(row => {
                const id = parseInt(row.getAttribute('data-id'));
                return data.boissons.find(x => x.id === id);
            });
            data.boissons = newOrder;
            save();
        }

        function save() { localStorage.setItem('buvetteSwipe', JSON.stringify(data)); }
        function resetCounts() { if(confirm("Reset ?")) { data.boissons.forEach(x => x.count = 0); save(); render(); }}

        render();
    </script>
</body>
</html>
