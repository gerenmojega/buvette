<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Buvette">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/931/931949.png">

    <title>Buvette Master</title>
    <style>
        /* Adaptations pour le plein écran iPhone */
        :root {
            --safe-top: env(safe-area-inset-top);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #121212; 
            color: white; 
            padding: 10px; 
            padding-top: calc(var(--safe-top) + 20px); /* Évite l'encoche de l'iPhone */
            margin: 0; 
            padding-bottom: 100px; 
        }

        h2 { text-align: center; color: #f39c12; margin-bottom: 20px; }
        
        .boisson-wrapper { position: relative; margin-bottom: 12px; background: #c0392b; border-radius: 16px; overflow: hidden; }
        .favori-bg { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #f1c40f; display: flex; align-items: center; padding-left: 20px; color: black; font-weight: bold; z-index: 1; }
        
        .boisson-row { 
            position: relative; display: flex; align-items: center; background: #2a2a2a; padding: 15px; 
            transition: transform 0.2s; z-index: 2; touch-action: pan-y;
        }

        .reorder-btns { display: flex; flex-direction: column; gap: 5px; margin-right: 15px; }
        .btn-move { background: #3d3d3d; color: white; border: none; border-radius: 6px; height: 28px; width: 38px; font-weight: bold; font-size: 1rem; }

        .info { flex-grow: 1; min-width: 0; }
        .nom { font-size: 1.15rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .controls { display: flex; align-items: center; gap: 12px; }
        .btn-calc { border: none; border-radius: 50%; color: white; font-weight: bold; width: 50px; height: 50px; font-size: 1.6rem; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .btn-plus { background: #2ecc71; }
        .btn-moins { background: #e74c3c; }
        .compteur { font-size: 1.6rem; min-width: 35px; text-align: center; font-weight: bold; font-variant-numeric: tabular-nums; }

        .fab {
            position: fixed; bottom: 30px; right: 25px;
            width: 65px; height: 65px; background: #3498db;
            border-radius: 50%; border: none; color: white;
            font-size: 2.2rem; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
        }

        .reset-link { display: block; width: 100%; margin-top: 50px; background: none; border: none; color: #555; text-decoration: underline; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h2>📊 MA BUVETTE</h2>
    <div id="menu"></div>
    
    <button class="fab" onclick="ajouterBoisson()">+</button>
    <button class="reset-link" onclick="resetCounts()">Réinitialiser les compteurs</button>

    <script>
        // Utilisation d'une clé de stockage stable
        let data = JSON.parse(localStorage.getItem('buvette_final_v5')) || {
            boissons: [
                { id: 1, nom: "🍺 Bière", count: 0, fav: false },
                { id: 2, nom: "🥤 Soda", count: 0, fav: false }
            ]
        };

        const menuEl = document.getElementById('menu');

        function render() {
            menuEl.innerHTML = '';
            data.boissons.forEach((b, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'boisson-wrapper';
                wrapper.innerHTML = `
                    <div class="favori-bg">★ Favori</div>
                    <div class="boisson-row">
                        <div class="reorder-btns">
                            <button class="btn-move" onclick="deplacer(${index}, -1)">↑</button>
                            <button class="btn-move" onclick="deplacer(${index}, 1)">↓</button>
                        </div>
                        <div class="info">
                            <div class="nom">${b.nom}${b.fav ? ' ⭐' : ''}</div>
                        </div>
                        <div class="controls">
                            <button class="btn-calc btn-moins" onclick="mod(${b.id}, -1)">-</button>
                            <span class="compteur" id="cnt-${b.id}">${b.count}</span>
                            <button class="btn-calc btn-plus" onclick="mod(${b.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                setupSwipe(wrapper.querySelector('.boisson-row'), b.id);
                menuEl.appendChild(wrapper);
            });
        }

        function setupSwipe(el, id) {
            let startX = 0, currentX = 0;
            el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; el.style.transition = 'none'; }, {passive: true});
            el.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX - startX;
                if (Math.abs(currentX) > 10) el.style.transform = `translateX(${currentX}px)`;
            }, {passive: true});
            el.addEventListener('touchend', () => {
                el.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                if (currentX > 140) toggleFav(id);
                else if (currentX < -140) suppr(id);
                el.style.transform = '';
                currentX = 0;
            });
        }

        function mod(id, val) {
            const b = data.boissons.find(x => x.id === id);
            if(b) {
                b.count = Math.max(0, b.count + val);
                save();
                document.getElementById('cnt-' + id).innerText = b.count;
            }
        }

        function deplacer(index, dir) {
            let n = index + dir;
            if (n >= 0 && n < data.boissons.length) {
                [data.boissons[index], data.boissons[n]] = [data.boissons[n], data.boissons[index]];
                save(); render();
            }
        }

        function toggleFav(id) {
            const b = data.boissons.find(x => x.id === id);
            if(b) { b.fav = !b.fav; save(); render(); }
        }

        function suppr(id) {
            const b = data.boissons.find(x => x.id === id);
            if(confirm(`Supprimer ${b.nom} ?`)) {
                data.boissons = data.boissons.filter(x => x.id !== id);
                save(); render();
            }
        }

        function ajouterBoisson() {
            const n = prompt("Nom de la boisson :");
            if(n && n.trim() !== "") {
                data.boissons.push({ id: Date.now(), nom: n, count: 0, fav: false });
                save(); render();
            }
        }

        function save() { localStorage.setItem('buvette_final_v5', JSON.stringify(data)); }
        function resetCounts() { if(confirm("Vider la caisse ?")) { data.boissons.forEach(b => b.count = 0); save(); render(); }}

        render();
    </script>
</body>
</html>
