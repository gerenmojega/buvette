<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buvette Pro Mobile</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 10px; margin: 0; padding-bottom: 100px; }
        h2 { text-align: center; color: #f39c12; margin-top: 15px; }
        
        .container { position: relative; }
        
        /* Structure des lignes */
        .boisson-wrapper { position: relative; margin-bottom: 10px; background: #c0392b; border-radius: 12px; overflow: hidden; }
        .favori-bg { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #f1c40f; display: flex; align-items: center; padding-left: 20px; color: black; font-weight: bold; z-index: 1; }
        
        .boisson-row { 
            position: relative; display: flex; align-items: center; background: #2a2a2a; padding: 12px 8px; 
            transition: transform 0.2s ease-out; z-index: 2; touch-action: pan-y;
        }

        /* Flèches de déplacement */
        .reorder-btns { display: flex; flex-direction: column; gap: 2px; margin-right: 8px; }
        .btn-move { background: #444; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.7rem; height: 22px; width: 30px; }
        .btn-move:active { background: #666; }

        .info { flex-grow: 1; min-width: 0; }
        .nom { font-size: 1.1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-star { color: #f1c40f; margin-left: 5px; }

        .controls { display: flex; align-items: center; gap: 12px; }
        .btn-action { border: none; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .btn-plus { width: 48px; height: 48px; font-size: 1.8rem; background: #2ecc71; }
        .btn-moins { width: 42px; height: 42px; font-size: 1.5rem; background: #e74c3c; }
        .compteur { font-size: 1.6rem; min-width: 32px; text-align: center; font-weight: bold; }

        /* Bouton + flottant */
        .fab {
            position: fixed; bottom: 25px; right: 25px;
            width: 65px; height: 65px; background: #3498db;
            border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 2.2rem; z-index: 100; border: none; color: white;
            display: flex; align-items: center; justify-content: center;
        }

        .reset-link { background: none; color: #555; border: none; text-decoration: underline; width: 100%; margin-top: 30px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <h2>📊 Ma Buvette</h2>
    
    <div id="menu" class="container"></div>

    <button class="reset-link" onclick="resetCounts()">Réinitialiser les compteurs</button>

    <button class="fab" onclick="ajouterBoisson()">+</button
